[project]
name = "miniapp-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.114.0",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.9.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
